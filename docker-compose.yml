# ============================================
# Compose (Podman) - Un pain d'avance
# ============================================
# Démarrage :  podman compose up -d
# Stripe CLI : podman compose --profile stripe up -d
# ⚠️  Copier .env.example vers .env avant le premier lancement

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: painavance-postgres
    environment:
      POSTGRES_DB: painavance
      POSTGRES_USER: painavance
      POSTGRES_PASSWORD: painavance
    ports:
      - "5435:5432" # Port externe:interne (localhost:5435)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - painavance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painavance -d painavance"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: docker.io/library/node:22-alpine
    container_name: painavance-app
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # ⚠️ Nom du service "postgres" (communication inter-conteneurs)
      DATABASE_URL: postgresql://painavance:painavance@postgres:5432/painavance
      NEXT_TELEMETRY_DISABLED: "1"
      # E-mails de dev capturés par Mailpit (voir .env.example pour la production)
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Hot reload fiable sur un volume monté depuis macOS
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    networks:
      - painavance-network
    command: sh -c "apk add --no-cache libc6-compat && npm install && npm run dev"

  # Capture les e-mails envoyés en développement : interface sur http://localhost:8026
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: painavance-mailpit
    ports:
      - "8026:8025" # 8025 souvent pris par un autre projet
    networks:
      - painavance-network

  # Relaie les webhooks Stripe (mode test) vers l'app : podman compose --profile stripe up -d
  # Le secret de signature s'affiche dans : podman compose logs stripe → copier dans STRIPE_WEBHOOK_SECRET
  stripe:
    image: docker.io/stripe/stripe-cli:latest
    container_name: painavance-stripe
    profiles: ["stripe"]
    env_file:
      - .env
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to app:3000/api/stripe/webhook
    depends_on:
      - app
    networks:
      - painavance-network

  # Tests de bout en bout (Chromium) : podman compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    container_name: painavance-e2e
    profiles: ["e2e"]
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://painavance:painavance@postgres:5432/painavance
      E2E_BASE_URL: http://app:3000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - app
    volumes:
      - .:/app
      # node_modules propre à ce container (glibc), distinct de celui de l'app (Alpine/musl)
      - e2e_node_modules:/app/node_modules
    networks:
      - painavance-network
    command: sh -c "npm install --no-audit --no-fund --loglevel=error && npx playwright test"

volumes:
  e2e_node_modules:
  postgres_data:
  app_node_modules:
  app_next:

networks:
  painavance-network:
    driver: bridge
